<script>
// Intercepting click, replacing image, and dynamically replacing sub-headline text
(function() {
    function setupCertifications() {
        // 1. Swapping description sub-headline text dynamically (handles browser caching)
        const allTextElements = document.querySelectorAll('.framer-16uh9sr, p, div');
        allTextElements.forEach(el => {
            if (el.textContent && el.textContent.includes("Advanced credentials in AI, Strategy, and Financial Markets")) {
                if (el.children.length === 0 || (el.children.length === 1 && el.children[0].tagName === 'BR')) {
                    el.textContent = "Advanced credentials across key sectors, including AI, Business Strategy, Finance, and more.";
                } else {
                    for (let i = 0; i < el.childNodes.length; i++) {
                        let node = el.childNodes[i];
                        if (node.nodeType === 3 && node.textContent.includes("Advanced credentials in AI")) {
                            node.textContent = "Advanced credentials across key sectors, including AI, Business Strategy, Finance, and more.";
                        }
                    }
                }
            }
        });

        // 2. Intercepting links and injecting vector mockup
        const links = document.querySelectorAll('a[href*="planza.framer.website"]');
        links.forEach(link => {
            let isStrategist = false;
            let parent = link.parentElement;
            while (parent) {
                if (parent.textContent && parent.textContent.includes("Globally Certified Strategist")) {
                    isStrategist = true;
                    break;
                }
                parent = parent.parentElement;
            }
            
            if (isStrategist) {
                // Prevent redirection
                if (link.hasAttribute('href')) {
                    link.removeAttribute('href');
                    link.style.cursor = 'pointer';
                }
                
                // Add click listener
                if (!link.dataset.hasCertListener) {
                    link.dataset.hasCertListener = "true";
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        openCertificationsModal();
                    });
                }
                
                // Hide standard images
                const img = link.querySelector('img');
                if (img && img.style.display !== 'none') {
                    img.style.display = 'none';
                }
                const bgWrapper = link.querySelector('[data-framer-background-image-wrapper]');
                if (bgWrapper && bgWrapper.style.display !== 'none') {
                    bgWrapper.style.display = 'none';
                }
                
                // Append our custom vector overview cards mockup using Unsplash images
                let mockup = link.querySelector('.cert-overview-mockup');
                if (!mockup) {
                    mockup = document.createElement('div');
                    mockup.className = 'cert-overview-mockup';
                    mockup.innerHTML = `
                        <div class="cert-mockup-title">Credential Portfolio</div>
                        <div class="cert-mockup-cards">
                            <div class="cert-mockup-card cert-card-google">
                                <div class="cert-card-logo">
                                    <img src="/images/google_logo.png" alt="Google" class="cert-logo-img">
                                </div>
                                <div class="cert-card-text">
                                    <div class="cert-card-org">Google</div>
                                    <div class="cert-card-name">AI Prompting</div>
                                </div>
                            </div>
                            <div class="cert-mockup-card cert-card-yale">
                                <div class="cert-card-logo">
                                    <img src="/images/yale_logo.png" alt="Yale" class="cert-logo-img">
                                </div>
                                <div class="cert-card-text">
                                    <div class="cert-card-org">Yale University</div>
                                    <div class="cert-card-name">Financial Markets</div>
                                </div>
                            </div>
                            <div class="cert-mockup-card cert-card-illinois">
                                <div class="cert-card-logo">
                                    <img src="/images/uiuc_logo.png" alt="UIUC" class="cert-logo-img">
                                </div>
                                <div class="cert-card-text">
                                    <div class="cert-card-org">Illinois (UIUC)</div>
                                    <div class="cert-card-name">Advanced AI</div>
                                </div>
                            </div>
                        </div>
                        <div class="cert-mockup-footer">Click to View Certifications &rarr;</div>
                    `;
                    link.appendChild(mockup);
                }
            }
        });
    }

    window.openCertificationsModal = function() {
        const modal = document.getElementById('certifications-modal');
        if (modal) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.documentElement.style.overflow = 'hidden';
        }
    };

    window.closeCertificationsModal = function() {
        const modal = document.getElementById('certifications-modal');
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            document.documentElement.style.overflow = '';
        }
    };

    setInterval(setupCertifications, 500);
    setupCertifications();
})();

// Tabs click listeners
document.addEventListener('DOMContentLoaded', function() {
    const tabs = document.querySelectorAll('.cert-tab-btn');
    const slides = document.querySelectorAll('.cert-slide');
    
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            const index = tab.getAttribute('data-index');
            
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            slides.forEach(s => s.classList.remove('active'));
            const activeSlide = document.querySelector(`.cert-slide[data-index="${index}"]`);
            if (activeSlide) {
                activeSlide.classList.add('active');
            }
        });
    });
    
    const closeBtn = document.querySelector('.cert-modal-close');
    const overlay = document.querySelector('.cert-modal-overlay');
    if (closeBtn) closeBtn.addEventListener('click', window.closeCertificationsModal);
    if (overlay) overlay.addEventListener('click', window.closeCertificationsModal);
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            window.closeCertificationsModal();
        }
    });
});
</script>
